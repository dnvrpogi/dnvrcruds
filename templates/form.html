<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{action}} Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="p-4">
    <div class="container">
      <h1>{{action}} Record</h1>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Student Name</label>
          <input name="student_name" class="form-control" value="{{ item.student_name if item }}" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Student ID</label>
          <input name="student_id" class="form-control" value="{{ item.student_id if item }}" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input name="email" class="form-control" value="{{ item.email if item }}" />
        </div>
        <button class="btn btn-primary" type="submit">{{action}}</button>
        <a class="btn btn-secondary" href="/">Cancel</a>
      </form>
    </div>
  </body>
</html>
